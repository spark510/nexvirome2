evidence_kind: unverified
parameters:
  min_units: 3
  modules:
    graph_correction:
      implementation:
        command: [correct]
        settings: {min_fragments: 3, alternative_fraction: 0.9}
      min_relative_error_reduction: 0.5
      max_recovery_loss: 0.02
      max_resource_ratio: 2.0
    reference_masking:
      implementation:
        command: [mask, export]
        settings: {mode: hard}
      min_error_reduction: 0.0
      max_recovery_loss: 0.02
      max_resource_ratio: 2.0
    nmf:
      implementation:
        command: [latent, fit]
        settings: {rank: 2, seeds: [17, 29, 43]}
      min_error_reduction: 0.0
      max_recovery_loss: 0.02
      max_resource_ratio: 3.0
      requires: [at_least_three_biological_samples, nonconstant_abundance]
    structure:
      implementation:
        command: [structure, annotate]
        settings: {min_coverage: 0.5, evalue: 0.001}
      min_error_reduction: 0.0
      max_recovery_loss: 0.02
      max_resource_ratio: 3.0
      requires: [unresolved_candidates, curated_annotation_database]
